[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps = bodmer/TFT_eSPI@

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=13
    -D TFT_DC=14
    -D TFT_RST=27
    -D TFT_eSPI_ESP32=1
    -D LOAD_GLCD=1